name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: APK bauen
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk DrawboardKamera.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: DrawboardKamera.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: EXE bauen
        working-directory: pc
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --onefile --noconsole --name DrawboardKamera --hidden-import pystray._win32 drawboard_cam.py
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: pc/dist/DrawboardKamera.exe

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Release "latest" aktualisieren
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Neueste Version (Build ${{ github.run_number }})
          make_latest: true
          files: |
            DrawboardKamera.apk
            DrawboardKamera.exe
      - name: Tag auf neuesten Stand
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH repos/${{ github.repository }}/git/refs/tags/latest -f sha=${{ github.sha }} -F force=true || true
